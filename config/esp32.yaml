# ============================================================
# 客厅 RF 中枢（ESP32-S3 + ESPHome）
# ------------------------------------------------------------
# 代码拆到各 .h，本文件只保留声明式配置与 HA 实体清单：
#   sofa_rf_s3.h       nRF24/SI24R1 软件 SPI，电动沙发 8 帧（纯 GPIO + 静态数据）
#   fanlight_tx.h      T2L 433.92MHz OOK，风扇灯 11 组发射码表 + 挡位映射
#   slot_store.h       槽位数据：变长 NVS blob，数量无固定上限 + 旧 8 槽无损迁移
#   shenghui_switch.h  CC1101 433.3MHz 2-FSK，昇辉开关收包 / 学习 / 触发
#   rf_admin.h         槽位命名 / 删除 / 清单（薄封装，数据来自 slot_store）
#   custom_index.h     打了补丁的 ESPHome 首页（新增「昇辉开关管理」区块）
#   shenghui_tab.h     首页接管 + 该区块的 /sw/api 接口
#   shenghui_mqtt.h    HA MQTT Discovery：把动态槽位暴露成 HA 按钮 / 事件实体
#
# 注意：includes: 注入到 main.cpp 顶部，早于所有 id(...) 对象声明，
#       因此头文件不直接引用 id(...)，对象一律由 lambda 以参数传入。
#       sw_frames / sw_names 两个旧 globals 保留原样且只读：它们是 OTA
#       之前那 8 槽数据的迁移源，on_boot 里由 slot_store::load() 搬走。
#       之后所有槽位数据都在 slot_store.h 的变长 NVS blob 里，立即落盘。
#
# 接线（数字 = 板子丝印编号，等于 GPIO 编号）：
#   E07/CC1101: GDO0=4  CSN=5  SCK=14  MOSI=13  MISO=12  VCC=3V3  GND=GND
#   T2L:        DAT=7   VCC=3V3  GND=GND   （DAT 别用 19/20=USB 口引脚）
#   nRF24:      CE=15  CSN=16  SCK=17  MOSI=18  MISO=21  VCC=3V3(加 10µF+100nF 退耦)
#
# 协议要点：
#   昇辉   433.3MHz / 250k 2-FSK / 频偏 90kHz，同步字 54 21，
#          负载 A4 23 + 8 字节码，触发时连发 4 次；学习需 1.5s 内两次相同帧
#   风扇灯 433.92MHz / rc-switch protocol 1 / pulse 250us / 重发 40
#   沙发   2480MHz / 1Mbps / 0dBm，地址 05 DC 03 00 00，DPL 免确认
#
# HA 实体：1 个风扇 + 9 个按钮（昇辉槽位另由 MQTT Discovery 动态生成）
#   文本传感器 sw_status 设为 internal: true，只作内部提示，不注册到 HA。
#   风扇灯改为官方 template fan：6 挡速度滑块 + 正反转方向 + 开关（停），
#   只保留「风扇灯开关」一个独立按钮；挡位/方向/停都由 fan 触发器发射。
#   标签全部使用中文，并带连续编号保证同平台内 ASCII 实体 ID 唯一：
#     按钮 01     风扇灯开关
#     按钮 02~09  沙发一/二/三移出移回、沙发全部移出 / 沙发全部移回
#   昇辉开关不再有固定房间按钮，也没有固定房间名：统一在 ESP32 首页
#   「昇辉开关管理」区块里填名称后点「添加昇辉控股开关」录入，录入后才
#   出现该开关的触发 / 改名 / 删除；名称可随时改，日志与状态同步变化。
#   槽位数量无固定上限，ID 单调递增、删除后不复用；数据存变长 NVS blob，
#   断电不丢，并通过 MQTT Discovery 同步成 HA 按钮 / 事件实体，
#   网页里叫什么 HA 里就叫什么。
# ============================================================

esphome:
  name: living-room-rf-hub
  friendly_name: 客厅 RF 中枢
  includes:
    - <array>
    - sofa_rf_s3.h
    - fanlight_tx.h
    - slot_store.h
    - shenghui_state.h
    - shenghui_switch.h
    - rf_admin.h
    - custom_index.h
    - shenghui_tab.h
    - shenghui_mqtt.h
  on_boot:
    then:
      - lambda: 'sofa_init();'   # 上电初始化 nRF24（软件 SPI，引脚见 sofa_rf_s3.h）
      # 一次性无损迁移：旧 globals（setup_priority=HARDWARE 800）此时已从
      # NVS 读回，on_boot 默认 600 在其之后执行。新 blob 存在则只读取，
      # 不存在才把旧 8 槽搬成 ID 1..8，之后永不再迁移。
      - lambda: 'slot_store::load(id(sw_frames), id(sw_names));'
      # 副码表是独立 blob：OTA 后首次启动按空表处理，旧 8 槽数据完全不动。
      - lambda: 'slot_store::alias_load();'
      # HA 按钮 → 按槽位 ID 重放对应 RF 帧；MQTT 命令回调不能直接发射，
      # shenghui_mqtt.h 内部会用 scheduler 推迟到主循环。
      - lambda: |-
          shenghui_mqtt::device().set_trigger([](int slot) {
            shenghui::trigger(id(rf_cc1101), slot);
          });
      # 接管首页并挂上「昇辉开关管理」区块与 /sw/api。用官方
      # web_server_base::add_handler()，自动继承 web_server 的 digest 认证。
      # 对象由回调传入，头文件不直接引用 id(...)。
      - lambda: |-
          shenghui_tab::install(shenghui_tab::Api{
            []() -> std::string { return shenghui_tab::make_list(); },
            [](const std::string &name) {
              rf_admin::learn_auto(id(sw_status), name);
            },
            [](int slot) {
              shenghui::trigger(id(rf_cc1101), slot);
            },
            [](int slot) { rf_admin::clear_slot(slot); },
            [](int slot, const std::string &name) {
              rf_admin::set_name(slot, name);
            },
            [](int slot) { shenghui_mqtt::device().publish_slot(slot); },
            // 副码学习 / 清除：不产生新槽位，HA 实体与自动化不变。
            [](int slot) { rf_admin::alias_learn_start(id(sw_status), slot); },
            [](int slot) { rf_admin::alias_clear(slot); },
            // 状态胶囊对表：只发 MQTT 请求 HA 改假状态，不发射 RF 信号。
            [](int slot, bool on) { shenghui_mqtt::device().publish_state_set(slot, on); },
          });

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:

# ---------------- HA MQTT Discovery（昇辉动态开关） ----------------
# discovery: false 关闭 ESPHome 自身实体的自动发现，HA 不会出现风扇 /
# 沙发 / 文本传感器的重复实体；昇辉按钮的 config 由 shenghui_mqtt.h
# 手动发到 homeassistant/button/.../config（retain），录入/改名/删除即时同步。
# reboot_timeout: 0s：broker 不可达时不要重启设备（RF 中枢不能因 MQTT 掉线重启）。
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  topic_prefix: living-room-rf-hub
  discovery: false
  reboot_timeout: 0s
  # 若 broker 启用认证，取消下面两行注释并在 secrets.yaml 填值
  # username: !secret mqtt_username
  # password: !secret mqtt_password
  on_connect:
    # 每次连上（含重连）遍历所有曾用过的 ID 全量重发：已录入的发 config，
    # 已删除的发空 payload，保证 broker 换过 / 设备重启后仍一致。
    # on_connect 是底层 MQTT 库回调，此时 is_connected() 仍为 false，
    # 必须由 schedule_full_sync() 推迟到主循环再注册订阅 + 发布 config。
    - lambda: 'shenghui_mqtt::device().schedule_full_sync();'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "FanLight-Shenghui"
    password: !secret wifi_ap_password

captive_portal:

# ESP32 自带管理后台：http://<设备IP>/ ；local: true 把前端打进固件，不依赖外网 CDN
web_server:
  port: 80
  version: 3
  local: true
  # 官方选项：不渲染首页的 OTA Update 区块，同时关闭网页端固件上传。
  # 只影响 web_server；命令行 / Dashboard 走的 3232 端口 OTA 不受影响。
  ota: false
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

spi:
  clk_pin: 14
  miso_pin: 12
  mosi_pin: 13

globals:
  # 【历史迁移源，只读，请勿删除或改动 id / type / initial_value】
  # 这 8 槽数据在 OTA 到「无限槽位」版本前存在 NVS 里。ESPHome 的
  # restore_value 按 sizeof(T) 整块读写，改类型或长度会让旧数据全部失效。
  # slot_store::load() 会在首次启动时把它们搬进变长 blob，之后不再写入。
  - id: sw_frames
    type: std::array<std::array<uint8_t, 8>, 8>
    restore_value: true
    initial_value: "std::array<std::array<uint8_t, 8>, 8>{}"
  - id: sw_names
    type: std::array<std::array<char, 16>, 8>
    restore_value: true
    initial_value: "std::array<std::array<char, 16>, 8>{}"
  # 风扇卡片待发射的挡位。滑块拖动会连续下发多个 speed_level，
  # 各触发器只写这里，由 restart 脚本合并成最后一次发射（见 fan_emit_speed）。
  - id: fan_pending_speed
    type: int
    initial_value: "3"

text_sensor:
  # 射频收包 / 学习状态提示，逻辑见 shenghui_switch.h 与 rf_admin.h。
  # internal: true —— 只作为内部提示通道，不在「传感器与控制」首页渲染、
  # 也不注册到 HA。真正的灯状态看「昇辉开关管理」圆点与 HA input_boolean。
  # 保留实体对象是因为 C++ 里 on_packet / learn_auto / alias_learn_start
  # 都以 StatusT* 复用它写提示，删除会牵动整套射频逻辑。
  - platform: template
    name: "昇辉控股开关状态"
    id: sw_status
    internal: true

cc1101:
  id: rf_cc1101
  cs_pin: 5
  gdo0_pin: 4
  frequency: 433.3MHz
  modulation_type: 2-FSK
  fsk_deviation: 90kHz
  symbol_rate: 250000
  output_power: 10
  # 原固件 RX_BW=812.5kHz；ESPHome 上限 812kHz，取最接近的 650kHz
  # （250k FSK 需要 >=430kHz 带宽，默认 203kHz 会滤掉信号）
  filter_bandwidth: 650kHz
  packet_mode: true
  packet_length: 10
  crc_enable: false
  whitening: false
  sync_mode: 16/16
  sync1: 0x54
  sync0: 0x21
  on_packet:
    # 帧过滤 / 学习状态机 / 去重检测，实现见 shenghui_switch.h
    # 回调参数是 1-based 槽位 ID，直接对应 MQTT topic 与 HA 实体编号。
    - lambda: |-
        shenghui::on_packet(x, rssi, id(sw_status),
          [](int slot) { shenghui_mqtt::device().publish_slot(slot); },
          [](int slot) { shenghui_mqtt::device().publish_press(slot); });

remote_transmitter:
  pin: 7
  carrier_duty_percent: 100%

# ---------------- 风扇灯：HA 风扇卡片（6 挡滑块 + 正反转 + 开关） ----------------
# 底层仍是 6 组互不相关的 RF 码，滑块只是把 1~6 挡映射到对应那一组码。
# RF 单向发射无回传，卡的开关/挡位属乐观状态：断电后按 ALWAYS_OFF 复位，
# 用原装遥控器改挡不会同步回来。
fan:
  - platform: template
    name: "风扇灯"
    id: fanlight_fan
    speed_count: 6
    has_direction: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      # HA 只下发 turn_on 不带挡位时，也按当前挡位让风扇转起来
      - lambda: 'id(fan_pending_speed) = id(fanlight_fan).speed < 1 ? 3 : id(fanlight_fan).speed;'
      - script.execute: fan_emit_speed
    on_turn_off:
      # 先取消排队中的挡位帧，避免关掉之后又被打开发出去
      - script.stop: fan_emit_speed
      - remote_transmitter.transmit_raw:
          code: !lambda 'return fanlight::code(fanlight::FAN_STOP);'
          carrier_frequency: 0Hz
          repeat:
            times: 40
            wait_time: 0s
    on_speed_set:
      # x 为 HA 下发的 speed_level（1~6），只登记，不立即发射
      - lambda: 'id(fan_pending_speed) = x;'
      - script.execute: fan_emit_speed
    on_direction_set:
      # FanDirection: FORWARD=0 / REVERSE=1
      - remote_transmitter.transmit_raw:
          code: !lambda 'return fanlight::code(static_cast<int>(x) == 0 ? fanlight::FORWARD : fanlight::REVERSE);'
          carrier_frequency: 0Hz
          repeat:
            times: 40
            wait_time: 0s

# 滑块拖动防抖：restart 模式使每次新挡位重新计时，只有停止拖动 250ms 后
# 才发一组 RF 帧，避免一次拖动连发多帧把风扇打乱。
script:
  - id: fan_emit_speed
    mode: restart
    then:
      - delay: 250ms
      # 只有卡片仍处于「开」才发射。防止拖到一半又点了关闭，
      # 或 HA 同一次命令里同时带 state=false 与 speed_level 时误把风扇打开。
      - if:
          condition:
            - lambda: 'return id(fanlight_fan).state;'
          then:
            - remote_transmitter.transmit_raw:
                code: !lambda 'return fanlight::code(fanlight::speed_key(id(fan_pending_speed)));'
                carrier_frequency: 0Hz
                repeat:
                  times: 40
                  wait_time: 0s

button:
  # ---------------- 风扇灯独立动作（不属风扇卡片，码表见 fanlight_tx.h） ----------------
  - platform: template
    name: "风扇灯开关 01"
    on_press:
      - remote_transmitter.transmit_raw:
          code: !lambda 'return fanlight::code(fanlight::LIGHT);'
          carrier_frequency: 0Hz
          repeat:
            times: 40
            wait_time: 0s

  # 总关已删除；六挡 / 风扇停 / 正反转并入上方的 template fan 卡片，不再单列按钮。
  # 昇辉开关已改为首页「昇辉开关管理」区块动态录入，不再有固定房间按钮。

  # ---------------- 电动沙发：nRF24 8 动作（帧表见 sofa_rf_s3.h） ----------------
  - platform: template
    id: sofa1_out
    name: "沙发一移出 02"
    on_press:
      - lambda: 'sofa_send("r1o");'
  - platform: template
    id: sofa1_in
    name: "沙发一移回 03"
    on_press:
      - lambda: 'sofa_send("r1i");'
  - platform: template
    id: sofa2_out
    name: "沙发二移出 04"
    on_press:
      - lambda: 'sofa_send("r2o");'
  - platform: template
    id: sofa2_in
    name: "沙发二移回 05"
    on_press:
      - lambda: 'sofa_send("r2i");'
  - platform: template
    id: sofa3_out
    name: "沙发三移出 06"
    on_press:
      - lambda: 'sofa_send("r3o");'
  - platform: template
    id: sofa3_in
    name: "沙发三移回 07"
    on_press:
      - lambda: 'sofa_send("r3i");'
  - platform: template
    id: sofa_all_out
    name: "沙发全部移出 08"
    on_press:
      - lambda: 'sofa_send("rao");'
  - platform: template
    id: sofa_all_in
    name: "沙发全部移回 09"
    on_press:
      - lambda: 'sofa_send("rai");'

# 槽位管理不再暴露 HA 实体：统一在首页「昇辉开关管理」区块中操作（/sw/api）。
